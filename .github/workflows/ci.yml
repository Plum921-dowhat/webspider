name: CI

on:
  push:
    paths-ignore: ["README.md", "corpus.jsonl"]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Build
        working-directory: go-crawler
        run: go build ./...
      - name: Vet
        working-directory: go-crawler
        run: go vet ./...
      - name: Test
        working-directory: go-crawler
        run: go test ./...

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        working-directory: py-processor
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Test
        working-directory: py-processor
        run: python -m pytest tests -q
