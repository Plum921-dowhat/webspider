<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>爬虫结果看板</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <style>
    :root { --bg:#0f1117; --card:#1a1d27; --fg:#e6e6e6; --muted:#9aa0ac; --accent:#4f8cff; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
           background:var(--bg); color:var(--fg); padding:20px; }
    h1 { font-size:20px; margin:0 0 16px; }
    .cards { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:16px; }
    .card { background:var(--card); border-radius:12px; padding:18px; }
    .card .v { font-size:28px; font-weight:700; color:var(--accent); }
    .card .l { color:var(--muted); font-size:13px; margin-top:4px; }
    .charts { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px; }
    .chart { background:var(--card); border-radius:12px; padding:12px; height:320px; }
    .panel { background:var(--card); border-radius:12px; padding:16px; }
    .toolbar { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
    input, select, button { background:#11141c; color:var(--fg); border:1px solid #2a2f3a;
                            border-radius:8px; padding:8px 10px; font-size:14px; }
    button { cursor:pointer; background:var(--accent); border-color:var(--accent); color:#fff; }
    button:disabled { opacity:.5; cursor:not-allowed; }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    th, td { text-align:left; padding:8px 10px; border-bottom:1px solid #2a2f3a; vertical-align:top; }
    th { color:var(--muted); font-weight:600; }
    tr:hover td { background:#11141c; }
    a { color:var(--accent); word-break:break-all; }
    .preview { color:var(--muted); max-width:520px; }
    .chip { background:#11141c; border:1px solid #2a2f3a; border-radius:999px; padding:4px 10px; font-size:12px; color:var(--muted); }
    .chip b { color:var(--fg); margin-left:4px; }
    .overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:10; align-items:flex-start; justify-content:center; overflow:auto; padding:40px 16px; }
    .modal { background:var(--card); border-radius:12px; max-width:900px; width:100%; padding:20px; }
    .modal h2 { margin:0 40px 8px 0; font-size:18px; }
    .md-close { float:right; }
    .md-meta { color:var(--muted); font-size:12px; margin-bottom:6px; word-break:break-all; }
    .md-body { font-size:14px; line-height:1.6; word-break:break-word; }
    .md-body pre { background:#0d0f15; padding:12px; border-radius:8px; overflow:auto; }
    .md-body code { background:#0d0f15; padding:1px 5px; border-radius:4px; }
    .md-body img { max-width:100%; }
    .pager { display:flex; gap:10px; align-items:center; margin-top:12px; }
    .pager-go { margin-left:auto; display:flex; gap:8px; align-items:center; }
    .pager-go input { width:80px; text-align:center; }
    .toggle { background:none; border:none; color:var(--accent); padding:0; font-size:12px; cursor:pointer; }
  </style>
</head>
<body>
  <h1>爬虫结果看板</h1>

  <div class="cards">
    <div class="card"><div class="v" id="k-total">-</div><div class="l">文章总数</div></div>
    <div class="card"><div class="v" id="k-langs">-</div><div class="l">语言数</div></div>
    <div class="card"><div class="v" id="k-24">-</div><div class="l">近 24h 新增</div></div>
  </div>

  <div class="toolbar" style="margin-bottom:8px;">
    <button id="pie-toggle" style="background:#11141c;border:1px solid #2a2f3a;color:var(--fg);">分布维度: 语言 ⬄ 来源</button>
  </div>
  <div class="charts">
    <div class="chart" id="pie"></div>
    <div class="chart" id="line"></div>
  </div>

  <div class="panel" style="margin-bottom:16px;">
    <div class="toolbar" style="margin-bottom:10px;">
      <strong style="font-size:14px;">管道健康</strong>
      <span id="pipe-error" style="color:#e05c5c;font-size:12px;display:none;">Redis 不可达，指标暂不可用</span>
    </div>
    <div class="cards" style="grid-template-columns:repeat(6,1fr);margin-bottom:10px;">
      <div class="card" style="padding:12px;"><div class="v" id="p-produced" style="font-size:22px;">-</div><div class="l">爬取投递</div></div>
      <div class="card" style="padding:12px;"><div class="v" id="p-stored" style="font-size:22px;">-</div><div class="l">成功入库</div></div>
      <div class="card" style="padding:12px;"><div class="v" id="p-rejected" style="font-size:22px;">-</div><div class="l">门控拒绝</div></div>
      <div class="card" style="padding:12px;"><div class="v" id="p-pending" style="font-size:22px;">-</div><div class="l">PENDING</div></div>
      <div class="card" style="padding:12px;"><div class="v" id="p-dlq" style="font-size:22px;">-</div><div class="l">死信 DLQ</div></div>
      <div class="card" style="padding:12px;"><div class="v" id="p-stream" style="font-size:22px;">-</div><div class="l">流长度</div></div>
    </div>
    <div id="pipe-reasons" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;"></div>
    <div id="pipe-sources" style="display:flex;gap:8px;flex-wrap:wrap;"></div>
  </div>

  <div class="panel" style="margin-bottom:16px;">
    <div class="toolbar" style="margin-bottom:10px;">
      <strong style="font-size:14px;">采集监测</strong>
      <span id="health-status" class="chip">加载中…</span>
      <span id="health-error" style="color:#e05c5c;font-size:12px;display:none;">监测数据不可用</span>
    </div>
    <table style="margin-bottom:12px;">
      <thead><tr><th>源</th><th>最近一轮</th><th>耗时</th><th>页数</th><th>投递</th><th>失败页</th><th>状态</th></tr></thead>
      <tbody id="health-rows"></tbody>
    </table>
    <div class="chart" id="activity" style="height:240px;"></div>
  </div>

  <div class="panel" style="margin-bottom:16px;">
    <div class="toolbar" style="margin-bottom:10px;">
      <strong style="font-size:14px;">语义检索</strong>
      <span id="rag-hint" style="color:var(--muted);font-size:12px;">按语义在语料中检索相关片段（需配置 EMBEDDING_* 环境变量）</span>
    </div>
    <div class="toolbar" style="margin-bottom:10px;">
      <input id="rag-q" placeholder="语义检索：描述你想找的内容…" style="min-width:320px" />
      <select id="rag-source" style="min-width:130px">
        <option value="">全部来源</option>
        <option value="devto">devto</option>
        <option value="stackexchange">stackexchange</option>
        <option value="rss">rss</option>
      </select>
      <input id="rag-k" type="number" min="1" max="32" value="8" style="width:70px" title="Top-K" />
      <button id="rag-go">检索</button>
    </div>
    <div id="rag-results"></div>
  </div>

  <div class="panel">
    <div class="toolbar">
      <input id="q" placeholder="搜 URL / 正文关键词" style="min-width:240px" />
      <select id="lang"><option value="">全部语言</option></select>
      <select id="source"><option value="">全部来源</option></select>
      <button id="search">搜索</button>
      <button id="reset">重置</button>
    </div>
    <table>
      <thead><tr><th>ID</th><th>标题</th><th>来源</th><th>语言</th><th>长度</th><th>URL</th><th>时间</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="pager">
      <button id="prev">上一页</button>
      <span id="pageinfo"></span>
      <button id="next">下一页</button>
      <span class="pager-go">
        <input id="gopage" type="number" min="1" placeholder="页码" />
        <button id="go">跳转</button>
      </span>
    </div>
  </div>

  <div class="overlay" id="detail-overlay">
    <div class="modal">
      <button class="md-close" id="md-close">关闭</button>
      <h2 id="md-title"></h2>
      <div class="md-meta"><a id="md-url" target="_blank" rel="noopener"></a></div>
      <div class="md-meta" id="md-meta"></div>
      <div class="md-body" id="md-body"></div>
    </div>
  </div>

<script>
const $ = (id) => document.getElementById(id);
const pie = echarts.init($("pie"), "dark");
const line = echarts.init($("line"), "dark");
const act = echarts.init($("activity"), "dark");
let page = 1;
let lastTotal = 0;
let pieDim = "lang"; // "lang" | "source"
const PAGE_SIZE = 20;

// fetch wrapper: attaches the stored bearer token (set via DASH_TOKEN env on
// the server), prompting once when the server answers 401.
async function api(path) {
  const headers = {};
  const t = localStorage.getItem("dash_token");
  if (t) headers["Authorization"] = "Bearer " + t;
  const resp = await fetch(path, { headers });
  if (resp.status === 401) {
    const tok = prompt("此看板已开启访问控制，请输入访问令牌 (DASH_TOKEN)");
    if (tok) {
      localStorage.setItem("dash_token", tok);
      return api(path);
    }
    throw new Error("unauthorized");
  }
  return resp;
}

async function showDetail(id) {
  const a = await (await api("/api/articles/" + id)).json();
  $("md-title").textContent = a.title || "(无标题)";
  $("md-url").href = a.url;
  $("md-url").textContent = a.url;
  $("md-meta").textContent = [
    a.source_type, a.language, a.author, a.published_at,
    a.quality_score != null ? "质量分 " + a.quality_score : null,
  ].filter(x => x !== null && x !== undefined && x !== "").join(" · ");
  const body = $("md-body");
  if (typeof marked !== "undefined" && typeof DOMPurify !== "undefined") {
    body.innerHTML = DOMPurify.sanitize(marked.parse(a.content_md || ""));
  } else {
    body.innerHTML = "<pre style='white-space:pre-wrap;'>" + esc(a.content_md || "") + "</pre>";
  }
  $("detail-overlay").style.display = "flex";
}
$("md-close").onclick = () => { $("detail-overlay").style.display = "none"; };
$("detail-overlay").addEventListener("click", (e) => {
  if (e.target.id === "detail-overlay") $("detail-overlay").style.display = "none";
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") $("detail-overlay").style.display = "none";
});

async function loadSummary() {
  const s = await (await api("/api/summary")).json();
  $("k-total").textContent = s.total;
  $("k-langs").textContent = s.languages;
  $("k-24").textContent = s.last_24h;
}

async function loadPie() {
  const dim = pieDim;
  const d = await (await api(dim === "lang" ? "/api/lang-dist" : "/api/source-dist")).json();
  const data = d.map(x => dim === "lang"
    ? ({ name: x.language || "unknown", value: x.count })
    : ({ name: x.source || "unknown", value: x.count }));
  pie.setOption({
    backgroundColor: "transparent",
    title: { text: dim === "lang" ? "语言分布" : "来源分布", left: "center", textStyle: { fontSize: 14 } },
    tooltip: { trigger: "item" },
    series: [{
      type: "pie", radius: ["40%", "70%"], center: ["50%", "55%"],
      data,
      label: { color: "#e6e6e6" }
    }]
  });
}

async function loadLine() {
  const d = await (await api("/api/daily")).json();
  line.setOption({
    backgroundColor: "transparent",
    title: { text: "每日入库", left: "center", textStyle: { fontSize: 14 } },
    tooltip: { trigger: "axis" },
    grid: { left: 40, right: 20, top: 40, bottom: 30 },
    xAxis: { type: "category", data: d.map(x => x.day), axisLabel: { color: "#9aa0ac" } },
    yAxis: { type: "value", axisLabel: { color: "#9aa0ac" }, splitLine: { lineStyle: { color: "#2a2f3a" } } },
    series: [{ type: "line", smooth: true, areaStyle: {}, data: d.map(x => x.count) }]
  });
}

async function loadPipeline() {
  try {
    const p = await (await api("/api/pipeline")).json();
    $("p-produced").textContent = p.produced ?? "-";
    $("p-stored").textContent = p.stored ?? "-";
    $("p-rejected").textContent = p.rejected ?? "-";
    $("p-pending").textContent = p.pending ?? "-";
    $("p-dlq").textContent = p.dlq ?? "-";
    $("p-stream").textContent = p.stream_length ?? "-";
    const reasons = $("pipe-reasons");
    reasons.innerHTML = "";
    const entries = Object.entries(p.rejected_by_reason || {}).sort((a, b) => b[1] - a[1]);
    if (!entries.length) {
      reasons.innerHTML = '<span class="chip">暂无拒绝记录</span>';
    } else {
      entries.forEach(([reason, cnt]) => {
        const s = document.createElement("span");
        s.className = "chip";
        s.innerHTML = `${esc(reason)} <b>${cnt}</b>`;
        reasons.appendChild(s);
      });
    }
    $("pipe-error").style.display = "none";
    const sources = $("pipe-sources");
    sources.innerHTML = "";
    const stored = p.by_source || {}, rejected = p.rejected_by_source || {};
    const srcEntries = [...new Set([...Object.keys(stored), ...Object.keys(rejected)])];
    if (srcEntries.length) {
      srcEntries.sort((a, b) => (stored[b] || 0) - (stored[a] || 0));
      srcEntries.forEach(src => {
        const s = document.createElement("span");
        s.className = "chip";
        s.innerHTML = `${esc(src)} <b>入库 ${stored[src] || 0}</b> / 拒绝 <b>${rejected[src] || 0}</b>`;
        sources.appendChild(s);
      });
    }
  } catch (e) {
    $("pipe-error").style.display = "inline";
  }
}

async function loadHealth() {
  try {
    const h = await (await api("/api/health?hours=24")).json();
    const badge = $("health-status");
    const stale = (h.runs || []).filter(r => r.status === "stale");
    if (!h.runs || !h.runs.length) {
      badge.textContent = "暂无运行记录";
      badge.style.color = "var(--muted)";
    } else if (stale.length) {
      badge.textContent = "有源停滞: " + stale.map(r => r.source).join(", ");
      badge.style.color = "#e05c5c";
    } else {
      badge.textContent = "全部正常";
      badge.style.color = "#5cd67a";
    }
    const tb = $("health-rows");
    tb.innerHTML = "";
    (h.runs || []).forEach(r => {
      const dot = r.status === "ok" ? "#5cd67a" : (r.status === "stale" ? "#e05c5c" : "#9aa0ac");
      const when = r.age_minutes == null ? "-" :
        (r.age_minutes < 90 ? Math.round(r.age_minutes) + " 分钟前"
                            : (r.age_minutes / 60).toFixed(1) + " 小时前");
      const dur = r.duration_ms == null ? "-" : (r.duration_ms / 1000).toFixed(1) + "s";
      const tr = document.createElement("tr");
      tr.innerHTML =
        `<td>${esc(r.source)}</td><td>${when}</td><td>${dur}</td>` +
        `<td>${r.pages ?? "-"}</td><td>${r.published ?? "-"}</td><td>${r.failed_pages ?? "-"}</td>` +
        `<td><span style="color:${dot}">●</span> ${esc(r.status)}</td>`;
      tb.appendChild(tr);
    });
    const buckets = {};
    const sources = new Set();
    (h.series || []).forEach(s => {
      const t = new Date(s.taken_at);
      const key = new Date(Math.floor(t.getTime() / 300000) * 300000).toISOString().slice(0, 16).replace("T", " ");
      buckets[key] = buckets[key] || {};
      Object.entries(s.by_source || {}).forEach(([src, v]) => {
        sources.add(src);
        buckets[key][src] = (buckets[key][src] || 0) + (v.produced_delta || 0);
      });
    });
    const keys = Object.keys(buckets).sort();
    act.setOption({
      backgroundColor: "transparent",
      title: { text: "采集活动（24h 投递数 / 5分钟）", left: "center", textStyle: { fontSize: 14 } },
      tooltip: { trigger: "axis" },
      legend: { top: 24, textStyle: { color: "#9aa0ac" } },
      grid: { left: 40, right: 20, top: 56, bottom: 30 },
      xAxis: { type: "category", data: keys, axisLabel: { color: "#9aa0ac" } },
      yAxis: { type: "value", axisLabel: { color: "#9aa0ac" }, splitLine: { lineStyle: { color: "#2a2f3a" } } },
      series: [...sources].map(src => ({
        name: src, type: "line", smooth: true, showSymbol: false,
        data: keys.map(k => buckets[k][src] || 0)
      }))
    });
    $("health-error").style.display = "none";
  } catch (e) {
    $("health-error").style.display = "inline";
  }
}

async function loadFilters() {
  const langs = await (await api("/api/lang-dist")).json();
  const sel = $("lang");
  langs.forEach(x => {
    const o = document.createElement("option");
    o.value = x.language || ""; o.textContent = (x.language || "unknown") + " (" + x.count + ")";
    sel.appendChild(o);
  });
  const srcs = await (await api("/api/source-dist")).json();
  const ssel = $("source");
  srcs.forEach(x => {
    const o = document.createElement("option");
    o.value = x.source || ""; o.textContent = (x.source || "unknown") + " (" + x.count + ")";
    ssel.appendChild(o);
  });
}

function esc(s) { return (s || "").replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])); }

async function loadArticles() {
  const q = $("q").value.trim();
  const lang = $("lang").value;
  const source = $("source").value;
  const params = new URLSearchParams({ page, page_size: PAGE_SIZE });
  if (q) params.set("q", q);
  if (lang) params.set("lang", lang);
  if (source) params.set("source", source);
  const res = await (await api("/api/articles?" + params)).json();
  const tb = $("rows");
  tb.innerHTML = "";
  res.items.forEach(it => {
    const tr = document.createElement("tr");
    tr.innerHTML =
      `<td>${it.id}</td>` +
      `<td>${esc(it.title) || "-"}</td>` +
      `<td>${esc(it.source_type) || "-"}</td>` +
      `<td>${esc(it.language) || "-"}</td>` +
      `<td>${it.md_len}</td>` +
      `<td><a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.url)}</a></td>` +
      `<td>${it.created_at || "-"}</td>` +
      `<td><button class="toggle">详情</button></td>`;
    tr.querySelector(".toggle").onclick = () => showDetail(it.id).catch(e => alert("加载失败: " + e));
    tb.appendChild(tr);
  });
  lastTotal = res.total;
  const maxPg = Math.max(1, Math.ceil(lastTotal / PAGE_SIZE));
  $("pageinfo").textContent = `第 ${res.page} 页 / 共 ${maxPg} 页（${lastTotal} 条）`;
  $("prev").disabled = res.page <= 1;
  $("next").disabled = res.page >= maxPg;
  const gp = $("gopage");
  gp.max = maxPg;
  gp.value = res.page;
}

$("search").onclick = () => { page = 1; loadArticles(); };
$("reset").onclick = () => { $("q").value = ""; $("lang").value = ""; $("source").value = ""; page = 1; loadArticles(); };
$("pie-toggle").onclick = () => { pieDim = pieDim === "lang" ? "source" : "lang"; loadPie(); };

$("rag-go").onclick = ragSearch;
$("rag-q").addEventListener("keydown", e => { if (e.key === "Enter") ragSearch(); });
async function ragSearch() {
  const q = $("rag-q").value.trim();
  const box = $("rag-results");
  const hint = $("rag-hint");
  if (q.length < 2) { hint.textContent = "请输入至少 2 个字符"; return; }
  hint.textContent = "检索中…";
  const params = new URLSearchParams({ q, k: $("rag-k").value || 8 });
  const src = $("rag-source").value;
  if (src) params.set("source", src);
  try {
    const resp = await api("/api/search?" + params);
    if (resp.status === 429) {
      const d = await resp.json();
      hint.textContent = d.detail || "限流中，请稍后再试";
      return;
    }
    if (resp.status === 503) {
      const d = await resp.json();
      hint.textContent = "语义检索未启用：" + (d.detail || "");
      return;
    }
    const results = await resp.json();
    hint.textContent = results.length ? `命中 ${results.length} 条` : "无结果";
    box.innerHTML = "";
    results.forEach(r => {
      const card = document.createElement("div");
      card.style.cssText = "border:1px solid #2a2f3a;border-radius:8px;padding:10px;margin-bottom:8px;";
      const path = (r.heading_path || []).map(esc).join(" › ");
      card.innerHTML =
        `<div style="display:flex;justify-content:space-between;gap:8px;">` +
        `<a href="${esc(r.url)}" target="_blank" rel="noopener"><b>${esc(r.title) || "(无标题)"}</b></a>` +
        `<span style="color:var(--muted);font-size:12px;">score ${r.score}</span></div>` +
        (path ? `<div style="color:var(--muted);font-size:12px;margin:4px 0;">${path}</div>` : "") +
        `<div style="color:var(--fg);font-size:13px;margin-top:4px;">${esc(r.text).slice(0, 600)}${r.text.length > 600 ? "…" : ""}</div>` +
        `<div style="color:var(--muted);font-size:12px;margin-top:4px;">${esc(r.source_type)} · ${esc(r.published_at || "")}</div>`;
      box.appendChild(card);
    });
  } catch (e) {
    hint.textContent = "检索失败：" + e;
  }
}
$("prev").onclick = () => { if (page > 1) { page--; loadArticles(); } };
$("next").onclick = () => { page++; loadArticles(); };
$("q").addEventListener("keydown", e => { if (e.key === "Enter") { page = 1; loadArticles(); } });
function goPage() {
  const gp = $("gopage");
  const v = parseInt(gp.value, 10);
  const maxPg = Math.max(1, Math.ceil(lastTotal / PAGE_SIZE));
  if (Number.isNaN(v) || v < 1 || v > maxPg) {
    gp.value = page;
    return;
  }
  page = v;
  gp.value = page;
  loadArticles();
}
$("go").onclick = goPage;
$("gopage").addEventListener("keydown", e => { if (e.key === "Enter") goPage(); });

(async () => {
  await Promise.all([loadSummary(), loadPie(), loadLine(), loadFilters(), loadPipeline(), loadHealth()]);
  await loadArticles();
})();
setInterval(loadPipeline, 30000); // cheap Redis reads; charts stay manual
setInterval(loadHealth, 60000);
window.addEventListener("resize", () => { pie.resize(); line.resize(); act.resize(); });
</script>
</body>
