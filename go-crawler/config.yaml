redis:
  addr: "localhost:6379"
  password: ""
  stream: "articles"
  consumer_group: "py"

crawler:
  source: "devto"
  per_page: 100
  max_concurrency: 8
  rate_per_sec: 3
  since_hours: 0         # 0 = fetch all (full backfill)
  max_pages: 0           # 0 = unbounded (stop on empty page or cursor)
