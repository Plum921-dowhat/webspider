# Generic RSS/Atom engineering-blog feeds (RAG breadth). One poll per run;
# article pages are fetched by the processor under per-domain rate limits.
redis:
  addr: "localhost:6379"
  password: ""
  stream: "articles"
  consumer_group: "py"
  stream_max_len: 100000

crawler:
  source: "rss"
  per_page: 300
  max_concurrency: 4
  rate_per_sec: 2
  since_hours: 168     # engineering blogs post weekly-ish; dedup SET makes re-polls idempotent
  max_pages: 1
  interval_minutes: 60
  max_page_failures: 3
  rss_feeds:
    - "https://blog.cloudflare.com/rss/"
    - "https://github.blog/feed/"
    - "https://aws.amazon.com/blogs/aws/feed/"
    - "https://netflixtechblog.com/feed"
    - "https://engineering.fb.com/feed/"
