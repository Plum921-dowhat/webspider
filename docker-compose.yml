services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: crawler
      POSTGRES_PASSWORD: crawler_pwd
      POSTGRES_DB: corpus
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crawler -d corpus"]
      interval: 5s
      timeout: 3s
      retries: 10

  crawler:
    build: ./go-crawler
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy

  crawler-hashnode:
    build: ./go-crawler
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    command: ["/app/crawler", "/app/config.hashnode.docker.yaml"]

  crawler-rss:
    build: ./go-crawler
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    # ENTRYPOINT is the crawler binary; command only selects the config file.
    command: ["/app/config.rss.docker.yaml"]

  crawler-stackexchange:
    build: ./go-crawler
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    command: ["/app/config.stackexchange.docker.yaml"]
    environment:
      SE_API_KEY: ${SE_API_KEY:-}

  processor:
    build: ./py-processor
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379/0
      STREAM: articles
      DLQ_STREAM: articles_dlq
      CONSUMER_GROUP: py
      CONSUMER_NAME: proc-1
      PG_DSN: postgres://crawler:crawler_pwd@postgres:5432/corpus
      MIN_CONTENT_LEN: "100"

  monitor:
    build: ./py-processor
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: ["python", "monitor.py"]
    environment:
      REDIS_URL: redis://redis:6379/0
      STREAM: articles
      DLQ_STREAM: articles_dlq
      CONSUMER_GROUP: py
      PG_DSN: postgres://crawler:crawler_pwd@postgres:5432/corpus
      MONITOR_INTERVAL: "60"

  dashboard:
    build: ./py-processor
    restart: unless-stopped
    command: ["uvicorn", "dashboard.app:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PG_DSN: postgres://crawler:crawler_pwd@postgres:5432/corpus
      REDIS_URL: redis://redis:6379/0
      STREAM: articles
      DLQ_STREAM: articles_dlq
      CONSUMER_GROUP: py
    ports:
      - "8000:8000"

volumes:
  redis-data:
  pg-data:
